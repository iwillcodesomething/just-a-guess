plugins { id 'com.android.application' }
def backendUrl = (project.findProperty('JAG_API_URL') ?: System.getenv('JAG_API_URL') ?: 'https://lzqdnjrherdjfpuzhkgl.supabase.co').toString()
if (backendUrl && !backendUrl.startsWith('https://')) throw new GradleException('Release backend URL must use HTTPS')
def apiPrefix = backendUrl == 'https://lzqdnjrherdjfpuzhkgl.supabase.co' ? '/functions/v1/just-a-guess' : ''
def adMode = (project.findProperty('JAG_ADS_MODE') ?: System.getenv('JAG_ADS_MODE') ?: 'test').toString()
def adAppId = (project.findProperty('JAG_ADMOB_APP_ID') ?: System.getenv('JAG_ADMOB_APP_ID') ?: 'ca-app-pub-3940256099942544~3347511713').toString()
def adUnit = (project.findProperty('JAG_ADMOB_REWARDED_UNIT') ?: System.getenv('JAG_ADMOB_REWARDED_UNIT') ?: 'ca-app-pub-3940256099942544/5224354917').toString()
if (!(adMode in ['test','production'])) throw new GradleException('Unknown ads mode')
if (adMode == 'production' && (adAppId.contains('3940256099942544') || adUnit.contains('3940256099942544'))) throw new GradleException('Production ads require real publisher IDs')
if (!adAppId.matches('ca-app-pub-[0-9]+~[0-9]+') || !adUnit.matches('ca-app-pub-[0-9]+/[0-9]+')) throw new GradleException('Invalid AdMob ID format')
android {
    namespace 'app.justaguess.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'app.justaguess.mobile'
        minSdk 26
        targetSdk 35
        versionCode 600
        versionName '0.6.0'
        manifestPlaceholders = [cleartextTraffic: 'false',admobAppId: adAppId]
        buildConfigField 'boolean', 'AD_TEST_MODE', (adMode == 'test').toString()
        buildConfigField 'String', 'REWARDED_AD_UNIT', '"' + adUnit + '"'
        buildConfigField 'String', 'API_PATH_PREFIX', '"' + apiPrefix + '"'
        buildConfigField 'String', 'API_BASE_URL', '"' + backendUrl.replace('\\','\\\\').replace('"','\\"') + '"'
    }
    buildTypes {
        debug { applicationIdSuffix '.beta'; manifestPlaceholders.cleartextTraffic = 'true' }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
}
dependencyLocking { lockAllConfigurations() }
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; implementation 'com.google.android.gms:play-services-ads:25.5.0'; implementation 'com.google.android.ump:user-messaging-platform:4.0.0' }
